services:
  postgres:
    image: postgres:16
    container_name: pro4tech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pro4tech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pro4tech-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pro4tech
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pro4tech-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # ---- Servico de IA (so sobe com: docker compose --profile ai up) ----
  ollama:
    image: ollama/ollama
    container_name: pro4tech-ollama
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20

  ollama-init:
    image: ollama/ollama
    container_name: pro4tech-ollama-init
    profiles: ["ai"]
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${AI_MODEL:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: pro4tech-ai
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen3:4b}
      AI_THINK: ${AI_THINK:-true}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-600}
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  ollama_data:
